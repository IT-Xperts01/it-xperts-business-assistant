<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c2340">
  <title>IT Xperts Business Assistant</title>
  <script src="/config.js"></script>
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const root = document.getElementById("root");
    const backend = window.ITX_SUPABASE;
    const supabase = createClient(backend.url, backend.anonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
    const businessTypes = ["Shop", "Restaurant or food business", "Salon or personal care", "Pharmacy", "Repair or professional service", "Other"];
    let mode = "signin";
    let activeUser = null;
    let activeProfile = null;
    let authEmailDraft = "";
    try { authEmailDraft = sessionStorage.getItem("itx-auth-email") || ""; } catch {}
    function rememberAuthEmail(value) {
      authEmailDraft = String(value ?? "").trim();
      try {
        if (authEmailDraft) sessionStorage.setItem("itx-auth-email", authEmailDraft);
        else sessionStorage.removeItem("itx-auth-email");
      } catch {}
    }

    function safe(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
    }
    function setNotice(message, kind = "info") {
      const el = document.getElementById("notice");
      if (!el) return;
      el.className = `notice ${kind}`;
      el.textContent = message;
      el.hidden = !message;
    }
    function authScreen() {
      const confirming = mode === "confirm";
      const title = mode === "signup" ? "Create your account" : mode === "reset" ? "Reset your password" : confirming ? "Confirm your email" : "Welcome back";
      const lead = mode === "signup" ? "Create an account, then set up your business." : mode === "reset" ? "We’ll email you a secure password reset link." : confirming ? "One quick step before you can sign in." : "Sign in to open your business workspace.";
      const confirmationMarkup = confirming
        ? '<section class="confirmation-panel"><div class="confirmation-mark" aria-hidden="true">✉</div><h2>Check your email</h2><p>If this address needs verification, a link is on its way to <b>' + safe(authEmailDraft) + '</b>.</p><ol><li>Check your inbox and spam folder.</li><li>Open the newest IT Xperts confirmation email and tap its link.</li><li>Return here and sign in with the same email and password.</li></ol><p class="confirmation-help">Already confirmed or already have an account? Go to sign in. If you forgot your password, use “Forgot password?”</p><button id="resend-confirmation" class="primary" type="button">Resend confirmation email</button><button id="confirmed-signin" class="text-button" type="button">I’ve confirmed — go to sign in</button></section>'
        : "";
      const tabsMarkup = '<div id="tabs" class="tabs" ' + ((mode === "reset" || confirming) ? "hidden" : "") + '><button type="button" class="' + (mode === "signin" ? "selected" : "") + '" data-mode="signin">Sign in</button><button type="button" class="' + (mode === "signup" ? "selected" : "") + '" data-mode="signup">Sign up</button></div>';
      const passwordMarkup = mode === "reset" ? "" : '<label for="password">Password</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="' + (mode === "signup" ? "new-password" : "current-password") + '" ' + (mode === "signup" ? "minlength=8" : "") + ' required><button class="reveal" type="button" aria-label="Show password" aria-pressed="false">Show</button></div><p class="password-hint" ' + (mode === "signup" ? "" : "hidden") + '>Use a new, unique password. A password manager can generate a strong one.</p>' + (mode === "signin" ? '<button type="button" id="forgot" class="text-button">Forgot password?</button>' : "");
      const submitLabel = mode === "signup" ? "Create account" : mode === "reset" ? "Send reset link" : "Sign in";
      const backMarkup = mode === "reset" ? '<button type="button" id="back-signin" class="text-button">Back to sign in</button>' : "";
      root.innerHTML = '<main class="auth-wrap"><section class="auth-card"><a class="brand" href="/" aria-label="IT Xperts home"><span class="brand-mark">IT</span><span><b>IT Xperts</b><small>Business Assistant</small></span></a><h1 id="auth-title">' + title + '</h1><p class="lead">' + lead + '</p>' + tabsMarkup + '<div id="notice" class="notice" role="status" hidden></div>' + confirmationMarkup + '<form id="auth-form" novalidate ' + (confirming ? "hidden" : "") + '><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" value="' + safe(authEmailDraft) + '" required placeholder="you@example.com">' + passwordMarkup + (mode === "signup" ? '<label class="consent" for="accept-terms"><input id="accept-terms" type="checkbox" required><span>I agree to the <a href="/terms.html" target="_blank" rel="noopener noreferrer">Terms of use</a> and have read the <a href="/privacy.html" target="_blank" rel="noopener noreferrer">Privacy notice</a>.</span></label>' : "") + '<button id="submit" class="primary" type="submit">' + submitLabel + '</button>' + backMarkup + '</form><p class="fineprint" ' + (confirming ? "hidden" : "") + '><b>Business data protection.</b> Business records are saved to your signed-in account with access limited to that account. Keep your password private and sign out on shared devices. You can download a copy or restore a previous saved version in Settings.</p><p class="fineprint"><b>Need help?</b> <a href="https://wa.me/2348036085433?text=Hi%20IT%20Xperts%2C%20I%20need%20help%20with%20the%20Business%20Assistant." target="_blank" rel="noopener noreferrer">Chat with IT Xperts on WhatsApp · +234 803 608 5433</a></p><nav class="policy-links" aria-label="Legal information"><a href="/privacy.html" target="_blank" rel="noopener noreferrer">Privacy notice</a><a href="/terms.html" target="_blank" rel="noopener noreferrer">Terms of use</a></nav></section></main>';

      const emailInput = document.getElementById("email");
      emailInput?.addEventListener("input", () => rememberAuthEmail(emailInput.value));
      document.querySelectorAll("[data-mode]").forEach(button => button.addEventListener("click", () => {
        if (emailInput) rememberAuthEmail(emailInput.value);
        mode = button.dataset.mode;
        authScreen();
      }));
      const reveal = document.querySelector(".reveal");
      reveal?.addEventListener("click", () => {
        const input = document.getElementById("password");
        const visible = input.type === "password";
        input.type = visible ? "text" : "password";
        reveal.textContent = visible ? "Hide" : "Show";
        reveal.setAttribute("aria-label", visible ? "Hide password" : "Show password");
        reveal.setAttribute("aria-pressed", String(visible));
        input.focus();
      });
      document.getElementById("forgot")?.addEventListener("click", async () => {
        const email = document.getElementById("email").value.trim();
        if (!email) { setNotice("Enter your account email first.", "error"); document.getElementById("email").focus(); return; }
        rememberAuthEmail(email);
        const button = document.getElementById("forgot");
        button.disabled = true;
        const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo: location.origin });
        button.disabled = false;
        setNotice(error ? readableAuthError(error) : "If that email has an account, a password reset link is on its way.", error ? "error" : "success");
      });
      document.getElementById("resend-confirmation")?.addEventListener("click", async event => {
        const button = event.currentTarget;
        button.disabled = true;
        button.textContent = "Sending…";
        const { error } = await supabase.auth.resend({ type: "signup", email: authEmailDraft, options: { emailRedirectTo: location.origin } });
        button.disabled = false;
        button.textContent = "Resend confirmation email";
        setNotice(error ? readableAuthError(error) : "If this address still needs confirmation, another link is on its way. Check your inbox and spam folder, then open the newest link.", error ? "error" : "success");
      });
      document.getElementById("confirmed-signin")?.addEventListener("click", () => {
        mode = "signin";
        authScreen();
        setNotice("Sign in with the same email and password you used to create the account.", "info");
      });
      document.getElementById("back-signin")?.addEventListener("click", () => {
        mode = "signin";
        authScreen();
      });
      document.getElementById("auth-form")?.addEventListener("submit", submitAuth);
    }

    function readableAuthError(error) {
      const message = String(error?.message ?? "Something went wrong. Please try again.");
      if (error?.code === "weak_password" || /weak password/i.test(message)) {
        const reasons = Array.isArray(error?.reasons) ? error.reasons.join(", ") : "";
        return reasons ? "Choose a stronger password: " + reasons + ". Try a longer, unique passphrase." : "Choose a longer, unique password. Try at least 12 characters with a mix of letters, numbers, or symbols.";
      }
      if (/rate.?limit|too many requests/i.test(message)) return "Too many emails were requested. Wait a little while, then try again and check your spam folder.";
      return message;
    }

    async function submitAuth(event) {
      event.preventDefault();
      setNotice("");
      const email = document.getElementById("email").value.trim();
      rememberAuthEmail(email);
      const password = document.getElementById("password")?.value ?? "";
      const button = document.getElementById("submit");
      if (mode === "signup" && !document.getElementById("accept-terms")?.checked) { setNotice("Please agree to the Terms of use and read the Privacy notice before creating an account.", "error"); document.getElementById("accept-terms")?.focus(); return; }
      button.disabled = true;
      button.textContent = "Please wait…";
      let result;
      if (mode === "signup") {
        if (password.length < 8) { button.disabled = false; button.textContent = "Create account"; return setNotice("Use at least 8 characters. If it is still rejected as weak, choose a longer, unique password.", "error"); }
        result = await supabase.auth.signUp({ email, password, options: { emailRedirectTo: location.origin, data: { terms_version: "2026-10-22", terms_accepted_at: new Date().toISOString() } } });
        button.disabled = false;
        button.textContent = "Create account";
        if (result.error) return setNotice(readableAuthError(result.error), "error");
        if (result.data.session) {
          rememberAuthEmail("");
          return loadWorkspace(result.data.user);
        }
        mode = "confirm";
        authScreen();
        setNotice("Your account is ready for email confirmation. Follow the steps below, then sign in.", "success");
        return;
      }
      result = await supabase.auth.signInWithPassword({ email, password });
      button.disabled = false;
      button.textContent = "Sign in";
      if (result.error) {
        if (/email not confirmed|email_not_confirmed/i.test(String(result.error.message ?? ""))) {
          mode = "confirm";
          authScreen();
          return setNotice("This account needs email confirmation before sign-in. Check your inbox or spam folder, or request a fresh link below.", "error");
        }
        return setNotice(result.error.message === "Invalid login credentials" ? "We couldn’t sign you in. Check the email and password used when you created the account. If you’ve forgotten the password, use “Forgot password?”. " : readableAuthError(result.error), "error");
      }
      rememberAuthEmail("");
      await loadWorkspace(result.data.user);
    }

    async function loadWorkspace(user) {
      activeUser = user;
      root.innerHTML = `<div class="loading">Opening your business workspace…</div>`;
      let { data: profile, error } = await supabase.from("profiles").select("business_name,business_type,business_type_note,sales_mode,setup_completed").eq("id", user.id).maybeSingle();
      if (error) { authScreen(); return setNotice("Your sign-in worked, but we couldn’t load your account details. Please try again.", "error"); }
      if (!profile) {
        const created = await supabase.from("profiles").insert({ id: user.id }).select("business_name,business_type,business_type_note,sales_mode,setup_completed").single();
        if (created.error) { authScreen(); return setNotice("Your account is ready, but business setup could not be opened. Please sign out and try again.", "error"); }
        profile = created.data;
      }
      activeProfile = profile;
      const firstSetup = !profile.setup_completed;
      root.innerHTML = `<main class="workspace"><header class="workspace-head"><b>IT Xperts Business Assistant</b><button id="signout" type="button">Sign out</button></header><iframe id="app" title="IT Xperts Business Assistant workspace" src="/prototype/index.html?ws=${encodeURIComponent(user.id)}${firstSetup ? "&onboarding=1" : ""}"></iframe></main>`;
      const frame = document.getElementById("app");
      frame.addEventListener("load", () => sendProfile());
      document.getElementById("signout").addEventListener("click", async () => {
        const sync = frame.contentDocument?.getElementById("syncStatus")?.textContent ?? "";
        if (sync && !/All changes saved|Saved to your account/i.test(sync) && !confirm("Some business records may still be waiting to save. Sign out anyway?")) return;
        await supabase.auth.signOut();
      });
    }

    function sendProfile() {
      const frame = document.getElementById("app");
      if (!activeUser || !frame?.contentWindow) return;
      frame.contentWindow.postMessage({ type: "itx-profile", accountEmail: activeUser.email ?? "", businessName: activeProfile?.business_name, businessType: activeProfile?.business_type, businessTypeNote: activeProfile?.business_type_note ?? "", mode: activeProfile?.sales_mode }, location.origin);
    }

    function replyToWorkspace(message) {
      document.getElementById("app")?.contentWindow?.postMessage(message, location.origin);
    }

    function validWorkspaceData(data) {
      if (!data || typeof data !== "object" || Array.isArray(data)) return false;
      try { return new TextEncoder().encode(JSON.stringify(data)).length <= 1048576; }
      catch { return false; }
    }

    async function recentWorkspaceBackups(userId) {
      return supabase.from("business_workspace_backups")
        .select("id,created_at,reason")
        .eq("user_id", userId)
        .order("created_at", { ascending: false })
        .limit(30);
    }

    function workspaceDataHasRecords(saved) {
      if (!saved || typeof saved !== "object" || Array.isArray(saved)) return false;
      const todayTotal = saved.todayTotal;
      const dailyAmount = Number(todayTotal?.amount ?? todayTotal?.total ?? (typeof todayTotal === "number" ? todayTotal : 0));
      return ["sales", "expenses", "items", "invoices"].some(key => Array.isArray(saved[key]) && saved[key].length > 0)
        || dailyAmount > 0
        || Object.values(saved.netWorth ?? {}).some(value => Number(value) > 0);
    }

    async function workspaceBackupsWithRecords(userId, backups) {
      const idsWithRecords = [];
      const batchSize = 5;
      for (let offset = 0; offset < backups.length; offset += batchSize) {
        const batch = backups.slice(offset, offset + batchSize);
        const { data, error } = await supabase.from("business_workspace_backups")
          .select("id,data")
          .eq("user_id", userId)
          .in("id", batch.map(backup => backup.id));
        if (error) return null;
        const recordsById = new Map((data ?? []).map(row => [String(row.id), row.data]));
        for (const backup of batch) {
          if (workspaceDataHasRecords(recordsById.get(String(backup.id)))) idsWithRecords.push(String(backup.id));
        }
        if (idsWithRecords.length) return idsWithRecords;
      }
      return idsWithRecords;
    }

    async function saveWorkspaceRecords(data, requestId) {
      if (!activeUser || !validWorkspaceData(data)) {
        return replyToWorkspace({ type: "itx-records-saved", requestId, error: "The records could not be saved. Please try again." });
      }
      const { data: saved, error } = await supabase.from("business_workspaces")
        .upsert({ user_id: activeUser.id, data, updated_at: new Date().toISOString() }, { onConflict: "user_id" })
        .select("updated_at")
        .single();
      if (error) {
        const protectedConflict = /Workspace save rejected/.test(error.message ?? "");
        return replyToWorkspace({
          type: "itx-records-saved",
          requestId,
          protectedConflict,
          error: protectedConflict
            ? "To protect older records, these changes were not saved. Reload the page to load the saved records before making more changes."
            : "Your latest changes could not reach secure storage. Keep this page open and retry when connected."
        });
      }
      const backups = await recentWorkspaceBackups(activeUser.id);
      replyToWorkspace({ type: "itx-records-saved", requestId, savedAt: saved.updated_at, backups: backups.error ? [] : backups.data });
    }

    window.addEventListener("message", async event => {
      const frame = document.getElementById("app");
      if (event.origin !== location.origin || event.source !== frame?.contentWindow || !activeUser || !event.data) return;
      const { type, requestId } = event.data;

      if (type === "itx-sign-out") {
        await supabase.auth.signOut();
        return;
      }

      if (type === "itx-records-load") {
        const { data: workspace, error } = await supabase.from("business_workspaces")
          .select("data,updated_at")
          .eq("user_id", activeUser.id)
          .maybeSingle();
        if (error) return replyToWorkspace({ type: "itx-records-loaded", error: "Secure record storage is not ready. Please retry in a moment." });
        const backups = await recentWorkspaceBackups(activeUser.id);
        if (backups.error) return replyToWorkspace({ type: "itx-records-loaded", error: "Record recovery storage is not ready. Please retry in a moment." });
        let recoveryBackupIds = [];
        if (backups.data?.length && (!workspace || !workspaceDataHasRecords(workspace.data))) {
          recoveryBackupIds = await workspaceBackupsWithRecords(activeUser.id, backups.data);
          if (recoveryBackupIds === null) return replyToWorkspace({ type: "itx-records-loaded", error: "Available recovery copies could not be checked. Please retry." });
        }
        replyToWorkspace({ type: "itx-records-loaded", data: workspace?.data ?? null, savedAt: workspace?.updated_at ?? null, backups: backups.data ?? [], recoveryBackupIds });
        return;
      }

      if (type === "itx-records-save") {
        return saveWorkspaceRecords(event.data.data, requestId);
      }

      if (type === "itx-records-restore" || type === "itx-records-restore-data") {
        const args = {};
        if (type === "itx-records-restore") {
          const backupId = String(event.data.backupId ?? "");
          if (!/^\d+$/.test(backupId)) return replyToWorkspace({ type: "itx-records-restored", requestId, error: "That recovery copy could not be found." });
          args.p_backup_id = backupId;
        } else {
          const restoreData = event.data.data;
          if (!validWorkspaceData(restoreData) || !Array.isArray(restoreData.sales) || !Array.isArray(restoreData.expenses) || !Array.isArray(restoreData.items)) return replyToWorkspace({ type: "itx-records-restored", requestId, error: "That downloaded backup is not valid. Your current records were not changed." });
          args.p_data = restoreData;
        }
        const { error: restoreError } = await supabase.rpc("restore_business_workspace", args);
        if (restoreError) {
          const missingRestore = /function|schema cache/i.test(String(restoreError.message ?? ""));
          return replyToWorkspace({ type: "itx-records-restored", requestId, error: missingRestore ? "The secure restore update is not installed yet. Ask the administrator to apply the recovery update, then try again." : "The recovery copy could not be restored. Your current records are still available." });
        }
        const { data: saved, error: loadError } = await supabase.from("business_workspaces").select("data,updated_at").eq("user_id", activeUser.id).single();
        if (loadError || !saved) return replyToWorkspace({ type: "itx-records-restored", requestId, restoreApplied: true, error: "The restore finished, but the updated records could not be reloaded. Refresh the page before making changes." });
        const latest = await recentWorkspaceBackups(activeUser.id);
        replyToWorkspace({ type: "itx-records-restored", requestId, data: saved.data, savedAt: saved.updated_at, backups: latest.error ? [] : latest.data });
        return;
      }

      if (type !== "itx-setup-saved") return;
      const { businessName, businessType, businessTypeNote, mode: salesMode } = event.data;
      if (!String(businessName ?? "").trim() || !businessTypes.includes(businessType)) return;
      const update = { business_name: String(businessName).trim().slice(0, 80), business_type: businessType, business_type_note: businessType === "Other" ? String(businessTypeNote ?? "").slice(0, 120) : null, sales_mode: salesMode === "daily" ? "daily" : "individual", setup_completed: true, updated_at: new Date().toISOString() };
      const { error } = await supabase.from("profiles").update(update).eq("id", activeUser.id);
      if (error) alert("Business setup could not be saved to your account. Please try again.");
      else activeProfile = { ...activeProfile, ...update };
    });

    function recoveryScreen(session) {
      mode = "new-password";
      root.innerHTML = `<main class="auth-wrap"><section class="auth-card"><a class="brand" href="/"><span class="brand-mark">IT</span><span><b>IT Xperts</b><small>Business Assistant</small></span></a><h1>Choose a new password</h1><p class="lead">Make it unique and at least 8 characters.</p><div id="notice" class="notice" role="status" hidden></div><form id="new-password-form"><label for="new-password">New password</label><div class="password-wrap"><input id="new-password" type="password" autocomplete="new-password" minlength="8" required><button class="reveal" type="button" aria-label="Show password" aria-pressed="false">Show</button></div><button class="primary" type="submit">Save new password</button></form></section></main>`;
      document.querySelector(".reveal").addEventListener("click", event => { const input = document.getElementById("new-password"); const visible = input.type === "password"; input.type = visible ? "text" : "password"; event.currentTarget.textContent = visible ? "Hide" : "Show"; event.currentTarget.setAttribute("aria-label", visible ? "Hide password" : "Show password"); });
      document.getElementById("new-password-form").addEventListener("submit", async e => { e.preventDefault(); const password = document.getElementById("new-password").value; const submit = e.currentTarget.querySelector("button.primary"); submit.disabled = true; const { error } = await supabase.auth.updateUser({ password }); submit.disabled = false; if (error) return setNotice(error.message, "error"); setNotice("Password updated. Opening your workspace…", "success"); await loadWorkspace(session.user); });
    }

    supabase.auth.onAuthStateChange((event, session) => {
      if (event === "SIGNED_OUT") { activeUser = null; activeProfile = null; mode = "signin"; authScreen(); }
      if (event === "PASSWORD_RECOVERY" && session) recoveryScreen(session);
    });

    const { data: sessionData } = await supabase.auth.getSession();
    if (location.hash.includes("type=recovery")) {
      if (sessionData.session) recoveryScreen(sessionData.session);
      else { authScreen(); setNotice("This reset link is invalid or expired. Request a new password reset link.", "error"); }
    } else if (sessionData.session) await loadWorkspace(sessionData.session.user);
    else authScreen();
  </script>
